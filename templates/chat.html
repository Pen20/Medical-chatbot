<link
  href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
  rel="stylesheet"
  id="bootstrap-css"
/>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!DOCTYPE html>
<html>
  <head>
    <title>Medical Chatbot</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
      crossorigin="anonymous"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='style.css')}}"
    />
  </head>

  <body>
    <div class="container-fluid h-100">
      <div class="row justify-content-center h-100">
        <div class="col-md-8 col-xl-6 chat">
          <div class="card">
            <div class="card-header msg_head">
              <div class="d-flex bd-highlight">
                <div class="img_cont">
                  <img
                    src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                    class="rounded-circle user_img"
                  />
                  <span class="online_icon"></span>
                </div>
                <div class="user_info">
                  <span>Medical Chatbot</span>
                  <p>Ask me anything!</p>
                </div>
              </div>
            </div>

            <div id="messageFormeight" class="card-body msg_card_body"></div>

            <div class="card-footer">
              <!-- 🔑 New input field for user's OpenAI API key -->
              <div class="input-group mb-2">
                <input
                  type="password"
                  id="api_key"
                  name="api_key"
                  placeholder="Enter your OpenAI API Key"
                  class="form-control"
                  required
                />
                <div class="input-group-append">
                  <button type="button" id="saveKey" class="btn btn-success">
                    Save Key
                  </button>
                </div>
              </div>
              <small class="text-muted"
                >Your API key is only used locally during this session.</small
              >

              <!-- 💬 Message input -->
              <form id="messageArea" class="input-group mt-2">
                <input
                  type="text"
                  id="text"
                  name="msg"
                  placeholder="Type your message..."
                  autocomplete="off"
                  class="form-control type_msg"
                  required
                />
                <div class="input-group-append">
                  <button
                    type="submit"
                    id="send"
                    class="input-group-text send_btn"
                  >
                    <i class="fas fa-location-arrow"></i>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let userApiKey = "";

      // Save the key for the current session
      $("#saveKey").click(function () {
        const key = $("#api_key").val().trim();
        if (key) {
          userApiKey = key;
          alert("✅ API Key saved for this session!");
        } else {
          alert("⚠️ Please enter a valid API key.");
        }
      });

      // Handle message sending
      $(document).ready(function () {
        $("#messageArea").on("submit", function (event) {
          event.preventDefault();

          const date = new Date();
          const str_time = date.getHours() + ":" + date.getMinutes();
          var rawText = $("#text").val();

          if (!userApiKey) {
            alert("Please enter and save your OpenAI API key first!");
            return;
          }

          // User message bubble
          var userHtml =
            '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' +
            rawText +
            '<span class="msg_time_send">' +
            str_time +
            '</span></div><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div></div>';

          $("#text").val("");
          $("#messageFormeight").append(userHtml);

          // Send the message and API key to the Flask backend
          $.ajax({
            data: {
              msg: rawText,
              api_key: userApiKey,
            },
            type: "POST",
            url: "/get",
          }).done(function (data) {
            // Bot reply bubble
            var botHtml =
              '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg"></div><div class="msg_cotainer">' +
              data +
              '<span class="msg_time">' +
              str_time +
              "</span></div></div>";
            $("#messageFormeight").append($.parseHTML(botHtml));
          });
        });
      });
    </script>
  </body>
</html>
